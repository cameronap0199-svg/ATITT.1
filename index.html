<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1f33">
  <meta name="description" content="Knotwood — an anime tactical trading card game. Duel AI rivals or friends online, open booster packs and build decks.">
  <title>Knotwood Card Battle</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;800&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="client/css/base.css">
  <link rel="stylesheet" href="client/css/cards.css">
  <link rel="stylesheet" href="client/css/screens.css">
  <link rel="stylesheet" href="client/css/battle.css">
</head>
<body>
  <div id="bg" aria-hidden="true">
    <div class="bg-sky"></div>
    <div class="bg-sun"></div>
    <div class="bg-hills far"></div>
    <div class="bg-hills mid"></div>
    <div class="bg-hills near"></div>
    <canvas id="bg-particles"></canvas>
  </div>
  <main id="app"></main>
  <canvas id="fx"></canvas>
  <div id="float-layer" aria-hidden="true"></div>
  <div id="overlay-root"></div>
  <div id="toast-root" role="status" aria-live="polite"></div>
  <noscript><div class="noscript">Knotwood needs JavaScript to run.</div></noscript>
  <script type="module" src="client/js/main.js"></script>
</body>
</html>
